<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Alpha</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #101823; }
  body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfdae6; }
  #game { display: block; width: 100%; height: 100%; }

  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: #e8eef5; opacity: .65; pointer-events: none;
  }
  #hud {
    position: fixed; left: 14px; bottom: 12px; pointer-events: none;
    opacity: .75; letter-spacing: .02em;
  }
  #hud b { font-weight: 600; color: #7fd6cf; }

  #overlay {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
    text-align: center; background: rgba(10, 16, 24, .82); backdrop-filter: blur(6px);
    cursor: pointer; transition: opacity .18s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { font-size: 26px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  #overlay p { opacity: .7; }
  #keys { display: grid; grid-template-columns: auto auto; gap: 6px 18px; text-align: left; opacity: .8; }
  #keys span:nth-child(odd) { color: #7fd6cf; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="hud">speed <b id="speed">0.0</b> · view <b id="view">first</b></div>

  <div id="overlay">
    <h1>Game Alpha</h1>
    <div id="keys">
      <span>WASD</span><span>move</span>
      <span>Space</span><span>jump</span>
      <span>Shift</span><span>slide (hold while moving)</span>
      <span>V</span><span>first / third person</span>
      <span>R</span><span>reset</span>
      <span>Esc</span><span>release mouse</span>
    </div>
    <p>click to play</p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
